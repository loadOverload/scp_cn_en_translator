# =============================================================
# 真实 SCP 语料上的 QLoRA 训练
#   数据来自 crawl.db -> 清洗 -> 分块 -> Qwen 难例重对齐
#   运行： ./py scripts/train.py --config configs/train.scp.yaml
#   或：   bash scripts/run_training_pipeline.sh     （等 Qwen 跑完再训练）
# =============================================================

defaults: train.yaml

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct    # Instruct 版，配合 chat template

training:
  output_dir: outputs/qwen2.5-7b-scp-chunks
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16           # 有效 batch = 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_seq_length: 4096                      # 与 chunk.max_total_tokens=3400 对齐
  overlong_policy: drop                     # 超长样本丢弃并计数，不截断
  train_on_assistant_only: true
  logging_steps: 10
  save_strategy: steps
  save_steps: 300
  save_total_limit: 3
  eval_strategy: steps
  eval_steps: 300
  report_to: [tensorboard]
  dataloader_num_workers: 4
  resume_from_checkpoint: null
  seed: 42

# 分块后的训练数据（Qwen 重对齐版本，由 align_chunks_qwen.py --merge-only --chat 生成）
data_files:
  train: data/processed/train.chunks.jsonl
  val: data/processed/val.chunks.jsonl
  test: data/processed/test.chunks.jsonl
  chat_train: data/processed/train.chunks.qwen.chat.jsonl
  chat_val: data/processed/val.chunks.qwen.chat.jsonl
